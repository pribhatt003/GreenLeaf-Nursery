<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - GreenLeaf Nursery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                🌿 GreenLeaf Nursery - Admin
            </a>

            <div>
                <a href="../index.html" class="btn btn-light">
                    <i class="bi bi-house"></i>
                    Website
                </a>
            </div>

        </div>
    </nav>


    <!-- Heading -->
    <section class="cart-hero">
        <div class="container">

            <h1 class="main-page-heading"
                style="color: white !important;">
                Admin Dashboard 🌿
            </h1>

            <p>
                Manage GreenLeaf Nursery orders
            </p>

        </div>
    </section>


    <!-- Dashboard -->
    <section class="container py-5">

        <div class="row g-4 mb-5">

            <!-- Total Orders -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body text-center p-4">

                        <i
                            class="bi bi-box-seam text-success"
                            style="font-size: 45px;"
                        ></i>

                        <h5 class="mt-3">
                            Total Orders
                        </h5>

                        <h2
                            id="totalOrders"
                            class="fw-bold text-success"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Products -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body text-center p-4">

                        <i
                            class="bi bi-flower1 text-success"
                            style="font-size: 45px;"
                        ></i>

                        <h5 class="mt-3">
                            Products
                        </h5>

                        <h2
                            id="totalProducts"
                            class="fw-bold text-success"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Pending Orders -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body text-center p-4">

                        <i
                            class="bi bi-clock-history text-warning"
                            style="font-size: 45px;"
                        ></i>

                        <h5 class="mt-3">
                            Pending Orders
                        </h5>

                        <h2
                            id="pendingOrders"
                            class="fw-bold text-warning"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- Orders -->
        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h3 class="fw-bold text-success mb-4">
                    Recent Orders
                </h3>
                <div class="mb-3">
    <input
        type="text"
        id="orderSearch"
        class="form-control"
        placeholder="🔍 Search by Order ID, Customer, Email, Phone..."
    >
</div>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-success">

                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="ordersTable">

                            <tr>
                                <td
                                    colspan="8"
                                    class="text-center text-muted"
                                >
                                    Loading orders...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>
<!-- Order Details Modal -->
<div class="modal fade" id="orderDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="bi bi-receipt"></i>
                    Order Details
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body" id="orderDetailsContent">
                Loading...
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="admin.js"></script>

   

</body>
</html>
