<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - GreenLeaf Nursery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🌿 GreenLeaf Nursery
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="wishlist.html">
                            ❤️ Wishlist
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            🛒 Cart
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Success Section -->
    <section class="container py-5">

        <div class="text-center">

            <div class="mb-4">
                <i
                    class="bi bi-check-circle-fill text-success"
                    style="font-size: 90px;"
                ></i>
            </div>

            <h1 class="fw-bold text-success">
                Order Placed Successfully! 🎉
            </h1>

            <p class="text-muted fs-5 mt-3">
                Thank you for shopping with GreenLeaf Nursery.
            </p>

            <div class="card shadow-sm border-0 mx-auto mt-4"
                 style="max-width: 500px;">

                <div class="card-body p-4">

                    <h4 class="fw-bold">
                        Your Order Has Been Confirmed
                    </h4>

                    <p class="text-muted mt-3">
                        Your plants will be prepared and processed
                        shortly.
                    </p>

                    <div class="alert alert-success mt-4">
                        <strong>Order ID:</strong>
                        <span id="orderId">
                            Loading...
                        </span>
                    </div>

                    <div class="d-grid gap-2 mt-4">

                        <a
                            href="shop.html"
                            class="btn btn-success"
                        >
                            <i class="bi bi-shop"></i>
                            Continue Shopping
                        </a>

                        <a
                            href="index.html"
                            class="btn btn-outline-success"
                        >
                            <i class="bi bi-house"></i>
                            Go To Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script>

        const orderId =
            localStorage.getItem("greenLeafOrderId");

        const orderIdElement =
            document.getElementById("orderId");

        if (orderId) {

            orderIdElement.textContent =
                orderId;

        } else {

            orderIdElement.textContent =
                "Order confirmed";

        }

    </script>

</body>
</html>
